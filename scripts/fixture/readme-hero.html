<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-energy-orb · hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(900px 480px at 74% 46%, rgba(30, 120, 190, .28), transparent 62%),
      radial-gradient(700px 400px at 12% 90%, rgba(20, 70, 130, .30), transparent 66%),
      #070b11;
    color: #dbe7f5;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    display: flex;
    align-items: center;
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(90, 130, 175, .07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90, 130, 175, .07) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(1100px 600px at 50% 50%, #000 45%, transparent 88%);
  }
  .copy { position: relative; z-index: 2; padding-left: 78px; width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; letter-spacing: .28em; text-transform: uppercase;
    color: #56c8f5; border: 1px solid rgba(86, 200, 245, .35);
    border-radius: 999px; padding: 7px 16px;
    background: rgba(20, 90, 140, .18);
  }
  .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: #56c8f5; box-shadow: 0 0 10px #56c8f5; }
  h1 { margin-top: 26px; font-size: 76px; line-height: 1.02; letter-spacing: -.02em; font-weight: 700; }
  h1 span { color: #63d6ff; }
  h2 { margin-top: 16px; font-size: 25px; font-weight: 500; color: #a9bfd6; letter-spacing: .01em; }
  ul { margin-top: 30px; display: flex; flex-direction: column; gap: 12px; }
  li { list-style: none; font-size: 17px; color: #b9cde2; display: flex; align-items: center; gap: 12px; }
  li b { color: #6fd8ff; font-weight: 600; }
  li::before { content: ""; width: 14px; height: 1px; background: #2f6c92; }
  .meta { position: absolute; left: 78px; bottom: 42px; font-size: 13px; letter-spacing: .16em; color: #4e6b87; text-transform: uppercase; }
  .stage { position: absolute; right: 46px; top: 74px; width: 486px; height: 486px; z-index: 1; }
  .stage canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="copy">
  <div class="eyebrow"><i></i>DSH plugin</div>
  <h1>Energy <span>Orb</span></h1>
  <h2>会话状态可视化装饰 · Web3D 能量球</h2>
  <ul>
    <li>静息时收缩沉默，<b>心跳关闭</b></li>
    <li>回合运行时<b>双拍心跳</b>，64 → 112 BPM 随强度提频</li>
    <li>三圈机械环 · 粒子核心 · 透明画布 · 零配置</li>
  </ul>
</div>
<div class="stage" id="stage"></div>
<div class="meta">three.js · bloom · 192 × 192 overlay</div>
<script type="module">
import { createEnergySphere } from '/energy-orb/assets/sphere/energy-sphere.js';

const sphere = createEnergySphere(document.getElementById('stage'), {
  color: '#42dcff',
  bpm: 64,
  coreScale: 1.08,
  coreBrightness: 1.3,
  energy: 1,
  rotationSpeed: 1,
  heartbeatEnabled: true,
  paused: false,
});
// 让 hero 定格在一帧稳定画面：等心跳跑起来后拍（脚本会等 window.__ready）
window.__sphere = sphere;
window.__ready = true;
</script>
</body>
</html>
