<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>energy-orb 生命周期 fixture（A7）</title></head>
<body style="background:#0A0D13">
<div id="mount"></div>
<script>
// 迷你 React 桩 + 迷你 vnode→DOM 渲染器：只为把 client.js 的真实组件接进真 DOM 数根元素
window.__ModuleLoader__ = { load(spec) { window.__spec = spec; } };
// A6：未捕获异常计数（降级路径不许炸页）
window.__uncaught = 0;
window.addEventListener('error', () => window.__uncaught++);
window.addEventListener('unhandledrejection', () => window.__uncaught++);
</script>
<script src="/client.js"></script>
<script type="module">
import * as React from './react-delegate.mjs';

const requireShim = (name) => {
  if (name === 'react') return React.delegate;
  throw new Error(`unexpected require: ${name}`);
};
const mod = window.__spec.factory(requireShim);

let OrbComponent = null;
mod.apply({
  slots: {
    inject(slot, cb) { return cb(); },
    register(opts, component) {
      if (opts.name !== 'shell.overlay' || opts.id !== 'dsh-energy-orb') {
        throw new Error(`注册形状不符: ${JSON.stringify(opts)}`);
      }
      OrbComponent = component;
      return () => {};
    },
  },
});

const container = document.getElementById('mount');
const results = {};

function mount() {
  React.beginRender();
  const tree = OrbComponent();
  container.replaceChildren(React.toDom(tree));
}
function unmount() {
  React.runCleanups(true);          // 二次调用不抛（幂等）
  container.replaceChildren();
}
function countRoots() {
  return document.querySelectorAll('[data-dsh-energy-orb-root]').length;
}
function countCanvases() {
  return document.querySelectorAll('[data-dsh-energy-orb-stage] canvas').length;
}
function countFallback() {
  return document.querySelectorAll('[data-dsh-energy-orb-fallback]').length;
}

// 球体是异步 import + 建 WebGL 上下文，等它就位再量（最多 8s）
async function waitFor(predicate, label, timeoutMs = 8000) {
  const start = performance.now();
  while (performance.now() - start < timeoutMs) {
    if (predicate()) return true;
    await new Promise((r) => requestAnimationFrame(r));
  }
  results[`timeout_${label}`] = true;
  return false;
}

mount();
results.afterMount1 = countRoots();
await waitFor(() => countCanvases() === 1 || countFallback() === 1, 'canvas1');
results.canvasAfterMount1 = countCanvases();
results.fallbackAfterMount1 = countFallback();
results.stageSrc = document.querySelector('[data-dsh-energy-orb-stage] canvas')?.tagName || null;

unmount();
results.afterUnmount1 = countRoots();
results.canvasAfterUnmount1 = countCanvases();

mount();
results.afterMount2 = countRoots();
await waitFor(() => countCanvases() + countFallback() >= 1, 'canvas2');
results.canvasAfterMount2 = countCanvases();
unmount();
results.afterUnmount2 = countRoots();
results.canvasAfterUnmount2 = countCanvases();

window.__results = results;
window.__results.uncaught = window.__uncaught;
window.__lifecycleReady = true;
</script>
</body>
</html>
