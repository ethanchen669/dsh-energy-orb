<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-energy-orb · states</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #070b11;
    color: #b9cde2;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    padding: 26px 30px 22px;
  }
  .strip { display: flex; gap: 26px; }
  .cell { width: 300px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .stage { width: 300px; height: 300px; }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .cap { text-align: center; line-height: 1.5; font-size: 14px; }
  .cap b { display: block; color: #e6f2ff; font-size: 15px; letter-spacing: .04em; }
  .cap span { color: #7f97b0; font-size: 12.5px; }
</style>
</head>
<body>
<div class="strip" id="strip"></div>
<script type="module">
import { createEnergySphere } from '/energy-orb/assets/sphere/energy-sphere.js';

const IDLE = {
  color: '#42dcff', heartbeatEnabled: false, coreScale: 0.82, coreBrightness: 0.5,
  energy: 0.55, rotationSpeed: 0.825, bpm: 56, paused: true,
};
const ACTIVE = {
  color: '#42dcff', heartbeatEnabled: false, coreScale: 1.08, coreBrightness: 0.975,
  energy: 0.9, rotationSpeed: 117.6, bpm: 112, paused: true,
};
const CASES = [
  { id: 'idle', options: IDLE, title: '静息', detail: '心跳关闭 · 核心 0.82× · 辉光 0.5 · 环 0.9 rev/min' },
  { id: 'active', options: ACTIVE, title: '激活', detail: '核心 1.08× · 辉光 0.975 · 环速 1.05×bpm' },
  { id: 'live', options: { ...ACTIVE, paused: false, heartbeatEnabled: true }, title: '使用中', detail: '双拍心跳 · 64→112 BPM · 最快环 124 rev/min' },
];

const strip = document.getElementById('strip');
for (const c of CASES) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const stage = document.createElement('div');
  stage.className = 'stage';
  stage.dataset.stageId = c.id;
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = `<b>${c.title}</b><span>${c.detail}</span>`;
  cell.append(stage, cap);
  strip.append(cell);
  const handle = createEnergySphere(stage, c.options);
  handle.update({});            // paused 时首帧要靠 update 触发
}

window.__ready = true;
</script>
</body>
</html>
